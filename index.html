#m{position:absolute;inset:0;z-index:1}.leaflet-control-zoom{margin-top:76px!important}

.settings-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.settings-close{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:4px 0}

.route-toggle input:checked+.toggle{background:var(--accent)}.route-toggle input:checked+.toggle:before{transform:translateX(18px)}

function toggleMenu(button){const panel=document.querySelector('#panel');const open=panel.classList.toggle('collapsed')===false;

function toggleSettings(){document.querySelector('.settings').classList.toggle('open');}

function requestLocation(){if(!navigator.geolocation)return;

  L.circleMarker(ll,{radius:8,color:'#1769aa',fillColor:'#43a5f5',fillOpacity:.9,weight:3})

  L.circle(ll,{radius:position.coords.accuracy,color:'#1769aa',fillOpacity:.08,weight:1}).addTo(map);
 },()=>{}, {enableHighAccuracy:true,timeout:10000,maximumAge:60000});}
